# Development / CI environment for HiPOP.
#
# Usage:
#   conda create -f conda/env.yaml    # Only once, to create the environment.
#   conda activate hipop-dev          # Each time you want to work on HiPOP.
#
# Remark: the CI workflow `.github/workflows/tests.yaml` uses this environment.
#
name: hipop-dev
channels: # TODO need to disable the default channel
  - conda-forge
dependencies:
  - cxx-compiler
  - cmake
  - llvm-openmp
  - python=3.10
  - pybind11
