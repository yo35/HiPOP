# Development / CI environment for HiPOP.
#
#   micromamba create -f conda/env.yaml      # or: conda env create -f conda/env.yaml
#   micromamba activate hipop-dev
#
# The CI workflow (.github/workflows/tests.yml) builds from this same file.
name: hipop-dev
channels:
  - conda-forge
dependencies:
  - cxx-compiler            # gcc on Linux / clang on macOS; sets $CC / $CXX
  - cmake
  - make
  - ninja
  - llvm-openmp             # OpenMP runtime (matches the MnMS env)

  # ---- Python wrapper ----
  - python=3.10
  - pybind11
  - numpy
  - matplotlib

  # ---- Test runner (for the Python-wrapper tests, added later) ----
  - pytest
