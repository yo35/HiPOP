name: Build & Test

on:
  push:
    branches: [ 'feature/**' ] # TODO remove feature/* once the workflow is stable
  pull_request:
    branches: [ main, 'feature/**' ] # TODO remove feature/* once the workflow is stable

jobs:
  build-and-test:
    name: Build & run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: # See https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - ubuntu-latest  # Arch: x64
          - windows-latest # Arch: x64
          - macos-latest   # Arch: arm64

    defaults:
      run:
        # Login shell so the conda environment set up below is active in every step
        # (works on Windows too: setup-miniconda configures the bash profile).
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: conda/env.yaml
          activate-environment: hipop-dev
          miniforge-version: latest # Miniforge => conda-forge channel + libmamba solver

      - name: Configure
        # `-G Ninja` forces a single-config build on every OS (without it Windows would
        # use the Visual Studio multi-config generator).
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
