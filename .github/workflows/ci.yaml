name: Build & Test

on:
  push:
    branches: [ 'feature/**' ] # TODO remove feature/* once the workflow is stable
  pull_request:
    branches: [ main, 'feature/**' ] # TODO remove feature/* once the workflow is stable

jobs:
  build-and-test:
    name: Build & run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: # See https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - ubuntu-latest  # Arch: x64
          - windows-latest # Arch: x64
          - macos-latest   # Arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.10'

      - name: Install pybind11
        run: pip install pybind11

      - name: Install OpenMP (macOS only)
        if: runner.os == 'macOS'
        run: brew install libomp # AppleClang has no OpenMP by default.

      - name: Configure
        shell: bash # Use Bash (will be Git Bash on Windows) for the array + conditional below.
        run: |
          args=(
            -S . -B build -G Ninja
            -D CMAKE_BUILD_TYPE=Release
            -D Python_EXECUTABLE='${{ steps.setup-python.outputs.python-path }}'
            -D pybind11_DIR="$(python -m pybind11 --cmakedir)"
          )
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(-D OpenMP_ROOT="$(brew --prefix libomp)")
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
