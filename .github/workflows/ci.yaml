name: Build & Test

on:
  push:
    branches:
      - 'feature/**' # TODO remove feature/* once the workflow is stable
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: # See https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - ubuntu-latest  # Arch: x64
          - windows-latest # Arch: x64
          - macos-latest   # Arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.10'

      - name: Install OpenMP (macOS only)
        if: runner.os == 'macOS'
        run: brew install libomp # AppleClang has no OpenMP by default.

      - name: C++ core library - Configure
        shell: bash # Use Bash (will be Git Bash on Windows) for the array + conditional below.
        run: |
          args=(
            -S . -B build-cpponly -G Ninja
            -D CMAKE_BUILD_TYPE=Release
            -D HIPOP_WITH_PYTHON=OFF
            -D HIPOP_WITH_TESTS=ON
            -D HIPOP_WITH_EXAMPLES=ON
          )
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(-D OpenMP_ROOT="$(brew --prefix libomp)")
          fi
          cmake "${args[@]}"

      - name: C++ core library - Build
        run: cmake --build build-cpponly

      - name: C++ core library - Run tests
        run: ctest --test-dir build-cpponly --output-on-failure --no-tests=error
